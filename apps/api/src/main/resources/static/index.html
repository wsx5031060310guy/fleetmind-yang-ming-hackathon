<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FleetMind</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">FleetMind</p>
        <h1>Speed Loss Dashboard</h1>
      </div>
      <a class="download" href="/api/fuel-consump/export">FUEL_CONSUMP CSV</a>
    </header>

    <section class="panel">
      <h2>Fleet Overview</h2>
      <table id="fleet">
        <thead>
          <tr>
            <th>Priority</th>
            <th>Vessel</th>
            <th>Speed Loss</th>
            <th>Fouling</th>
            <th>Confidence</th>
            <th>Quality</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="grid">
      <div class="panel">
        <h2>Vessel Trend</h2>
        <div id="performance"></div>
      </div>
      <div class="panel">
        <h2>Business Impact</h2>
        <div id="business"></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-heading">
        <h2>AI Ops Brief</h2>
        <div class="actions">
          <button id="generate" type="button">Generate</button>
          <button id="force-fallback" class="secondary" type="button">Force fallback</button>
        </div>
      </div>
      <div id="brief">Ready.</div>
    </section>

    <section class="panel">
      <h2>Data Quality</h2>
      <p id="quality"></p>
    </section>
    <p id="app-error" role="alert"></p>
  </main>
  <script src="/app.js"></script>
</body>
</html>

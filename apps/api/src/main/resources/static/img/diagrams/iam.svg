<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="FleetMind IAM 權限設定圖">
  <title>FleetMind — 權限設定：IAM 兩角色分離與網路權限邊界</title>
  <defs>
    <style>
      .f { font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC", sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .t-title { font-size: 23px; font-weight: 700; fill: #232F3E; }
      .t-sub   { font-size: 12.5px; font-weight: 400; fill: #5F6B7A; }
      .t-cloud { font-size: 12px; font-weight: 500; fill: #414D5C; }
      .t-grp   { font-size: 11.5px; font-weight: 600; fill: #414D5C; }
      .t-svc   { font-size: 11px; font-weight: 500; fill: #232F3E; text-anchor: middle; }
      .t-dsc   { font-size: 9px; font-style: italic; font-weight: 400; fill: #6E7B8B; text-anchor: middle; }
      .t-warn  { font-size: 9px; font-style: italic; font-weight: 600; fill: #DD344C; text-anchor: middle; }
      .t-pol   { font-size: 11.5px; font-weight: 600; fill: #232F3E; }
      .t-k     { font-size: 9.5px; font-weight: 600; fill: #8A94A0; }
      .t-v     { font-size: 10px; font-weight: 500; fill: #232F3E; }
      .t-vred  { font-size: 10px; font-weight: 700; fill: #DD344C; }
      .t-vcjk  { font-size: 10px; font-weight: 400; fill: #414D5C; }
      .t-fine  { font-size: 8.8px; font-weight: 400; fill: #8A94A0; }
      .t-arw   { font-size: 9px; font-weight: 500; fill: #6E7B8B; }
      .t-note  { font-size: 9.8px; font-weight: 400; fill: #4E5B6B; }
      .t-nb    { font-size: 9.8px; font-weight: 700; fill: #232F3E; }
      .t-bul   { font-size: 9.5px; font-weight: 400; fill: #4E5B6B; }
      .t-bulh  { font-size: 11px; font-weight: 700; fill: #232F3E; }
      .bdg     { font-size: 11px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .arrow   { fill: none; stroke: #879196; stroke-width: 1; marker-end: url(#ah); }
      .grpbox  { fill: none; stroke: #A7AFB7; stroke-width: 1; stroke-dasharray: 5 4; }
      /* modifiers must follow .grpbox: equal specificity, later rule wins.
         A CSS rule outranks a presentation attribute, so these cannot be set per-element. */
      .cloudbox { stroke: #879196; stroke-dasharray: none; }
      .netbox   { stroke: #DD344C; }
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 Z" fill="#879196"/>
    </marker>

    <!-- glyphs, 24x24 base -->
    <g id="g-ecs" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linejoin="round">
      <path d="M12,1.6 L22,7 L22,17 L12,22.4 L2,17 L2,7 Z"/>
      <path d="M12,12 L22,7 M12,12 L2,7 M12,12 L12,22.4"/>
    </g>
    <g id="g-iam">
      <path d="M8,10.5 V7.6 a4,4 0 0 1 8,0 V10.5" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <rect x="4.6" y="10.2" width="14.8" height="11" rx="2" fill="#FFFFFF"/>
      <circle cx="12" cy="14.6" r="1.7" fill="#DD344C"/>
      <rect x="11.2" y="15.4" width="1.6" height="3.6" fill="#DD344C"/>
    </g>
    <g id="g-ecr" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round">
      <path d="M12,2 L21,7 L12,12 L3,7 Z"/>
      <path d="M3,7 L3,17 L12,22 L12,12"/>
      <path d="M21,7 L21,17 L12,22"/>
    </g>
    <g id="g-logs" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round">
      <rect x="4" y="3" width="16" height="18" rx="2"/>
      <path d="M7.5,8 H16.5 M7.5,12 H16.5 M7.5,16 H13.5"/>
    </g>
    <g id="g-bed">
      <g fill="none" stroke="#FFFFFF" stroke-width="1.5">
        <path d="M12,12 L12,3.5 M12,12 L19.4,7.8 M12,12 L19.4,16.2 M12,12 L12,20.5 M12,12 L4.6,16.2 M12,12 L4.6,7.8"/>
      </g>
      <circle cx="12" cy="12" r="2.8" fill="#FFFFFF"/>
      <circle cx="12" cy="3.5" r="1.7" fill="#FFFFFF"/>
      <circle cx="19.4" cy="7.8" r="1.7" fill="#FFFFFF"/>
      <circle cx="19.4" cy="16.2" r="1.7" fill="#FFFFFF"/>
      <circle cx="12" cy="20.5" r="1.7" fill="#FFFFFF"/>
      <circle cx="4.6" cy="16.2" r="1.7" fill="#FFFFFF"/>
      <circle cx="4.6" cy="7.8" r="1.7" fill="#FFFFFF"/>
    </g>
    <g id="g-sns">
      <circle cx="12" cy="17.5" r="2.6" fill="#FFFFFF"/>
      <g fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round">
        <path d="M7.4,13.6 a6.5,6.5 0 0 1 9.2,0"/>
        <path d="M4,10.2 a11.3,11.3 0 0 1 16,0"/>
      </g>
    </g>
    <g id="g-ses" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round">
      <rect x="2.6" y="5.5" width="18.8" height="13" rx="1.6"/>
      <path d="M2.6,7 L12,14.2 L21.4,7"/>
    </g>
    <g id="g-alb">
      <g fill="none" stroke="#FFFFFF" stroke-width="1.6">
        <path d="M12,5.5 V12 M4,12 H20 M4,12 V17.5 M12,12 V17.5 M20,12 V17.5"/>
      </g>
      <circle cx="12" cy="3.4" r="2.3" fill="#FFFFFF"/>
      <circle cx="4" cy="19.6" r="2.3" fill="#FFFFFF"/>
      <circle cx="12" cy="19.6" r="2.3" fill="#FFFFFF"/>
      <circle cx="20" cy="19.6" r="2.3" fill="#FFFFFF"/>
    </g>
    <g id="g-net" fill="none" stroke="#FFFFFF" stroke-width="1.6">
      <circle cx="12" cy="12" r="9.4"/>
      <ellipse cx="12" cy="12" rx="4.1" ry="9.4"/>
      <path d="M2.7,12 H21.3 M4.2,7 H19.8 M4.2,17 H19.8"/>
    </g>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>

  <!-- title -->
  <text class="f t-title" x="42" y="40">權限設定 — IAM 兩角色分離，以及網路權限邊界</text>
  <text class="f t-sub" x="42" y="63">FleetMind · 帳號 516665228894 · us-east-1 · 2026-07-15 自帳號讀回 — 誠實框架：動作已收斂、一個資源釘死、兩個仍是萬用字元</text>

  <!-- AWS Cloud boundary — left edge inset to 72 so 0.0.0.0/0 sits outside the account -->
  <rect x="72" y="80" width="1488" height="800" rx="8" class="grpbox cloudbox"/>
  <rect x="81" y="89" width="25" height="25" rx="3" fill="#232F3E"/>
  <text class="f" x="93.5" y="105.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#FFFFFF">aws</text>
  <text class="f t-cloud" x="114" y="106">AWS Cloud · us-east-1 · 516665228894</text>

  <!-- ===================== caller: ECS task ===================== -->
  <rect x="148" y="372" width="56" height="56" rx="10" fill="#ED7100"/>
  <use href="#g-ecs" transform="translate(158.6,382.6) scale(1.4467)"/>
  <text class="f t-svc" x="176" y="444">ECS on Fargate</text>
  <text class="f t-dsc" x="176" y="456">cluster fleetmind · svc fleetmind-svc</text>
  <text class="f t-dsc" x="176" y="468">fleetmind-api:5 · ARM64 · 512 / 1024 MiB</text>
  <text class="f t-dsc" x="176" y="480">awsvpc · 容器埠 8080/tcp · desiredCount 1</text>
  <circle cx="142" cy="366" r="11" fill="#232F3E"/>
  <text class="f bdg" x="142" y="370">1</text>

  <!-- assume-role arrows -->
  <path class="arrow" d="M206,392 H280 V228 H354"/>
  <path class="arrow" d="M206,410 H280 V548 H354"/>
  <text class="f t-arw" x="274" y="312" text-anchor="end">sts:AssumeRole</text>
  <text class="f t-arw" x="274" y="324" text-anchor="end">（兩個角色</text>
  <text class="f t-arw" x="274" y="336" text-anchor="end">都信任同一服務）</text>

  <!-- ===================== LANE A : execution role ===================== -->
  <rect x="300" y="128" width="1240" height="230" rx="6" class="grpbox"/>
  <text class="f t-grp" x="316" y="147">執行角色（Execution role）— 由 ECS agent 使用；應用程式取不到這組憑證</text>

  <rect x="362" y="200" width="56" height="56" rx="10" fill="#DD344C"/>
  <use href="#g-iam" transform="translate(372.6,210.6) scale(1.4467)"/>
  <text class="f t-svc" x="390" y="272">fleetmind-ecs-exec</text>
  <text class="f t-dsc" x="390" y="285">trust: ecs-tasks.amazonaws.com</text>
  <text class="f t-dsc" x="390" y="297">IAM Role · 1 個 AWS 受管政策</text>
  <circle cx="358" cy="196" r="11" fill="#232F3E"/>
  <text class="f bdg" x="358" y="200">2</text>

  <path class="arrow" d="M418,228 H494"/>

  <rect x="500" y="196" width="548" height="104" rx="6" fill="#FFFFFF" stroke="#C6CDD3" stroke-width="1"/>
  <text class="f t-pol" x="514" y="217">AWS 受管政策 AmazonECSTaskExecutionRolePolicy</text>
  <rect x="906" y="204" width="128" height="17" rx="8.5" fill="#EDF1F5"/>
  <text class="f" x="970" y="216" text-anchor="middle" font-size="9" font-weight="600" fill="#5F6B7A">AWS 受管 · 未逐條列出</text>
  <text class="f t-k" x="514" y="243">用途</text>
  <text class="f t-vcjk" x="576" y="243">ECR 拉取映像 + CloudWatch Logs 寫入</text>
  <text class="f t-k" x="514" y="263">Effect / Action / Resource</text>
  <text class="f t-vcjk" x="676" y="263">由 AWS 定義</text>
  <text class="f t-fine" x="514" y="285">事實表只記錄「AWS-managed AmazonECSTaskExecutionRolePolicy」這個事實，未讀回逐條 statement，故此處不列。</text>

  <path class="arrow" d="M1048,240 H1180 V172 H1266"/>
  <path class="arrow" d="M1048,240 H1180 V272 H1266"/>
  <text class="f t-arw" x="1190" y="166">拉取映像</text>
  <text class="f t-arw" x="1190" y="266">寫入 log stream</text>

  <rect x="1278" y="150" width="44" height="44" rx="8" fill="#ED7100"/>
  <use href="#g-ecr" transform="translate(1286.4,158.4) scale(1.1367)"/>
  <text class="f t-svc" x="1300" y="208">Amazon ECR</text>
  <text class="f t-dsc" x="1300" y="220">516665228894.dkr.ecr.us-east-1.amazonaws.com</text>
  <text class="f t-dsc" x="1300" y="232">/fleetmind-api · ARM64 多階段建置</text>

  <rect x="1278" y="250" width="44" height="44" rx="8" fill="#E7157B"/>
  <use href="#g-logs" transform="translate(1286.4,258.4) scale(1.1367)"/>
  <text class="f t-svc" x="1300" y="308">CloudWatch Logs</text>
  <text class="f t-dsc" x="1300" y="320">log group /fleetmind/api</text>
  <text class="f t-dsc" x="1300" y="332">stream 前綴 ecs</text>

  <!-- ===================== LANE B : task role ===================== -->
  <rect x="300" y="372" width="1240" height="364" rx="6" class="grpbox"/>
  <text class="f t-grp" x="316" y="391">任務角色（Task role）— 容器內應用程式的執行期身分 · 3 個 inline 政策</text>

  <rect x="362" y="520" width="56" height="56" rx="10" fill="#DD344C"/>
  <use href="#g-iam" transform="translate(372.6,530.6) scale(1.4467)"/>
  <text class="f t-svc" x="390" y="592">fleetmind-ecs-task</text>
  <text class="f t-dsc" x="390" y="605">trust: ecs-tasks.amazonaws.com</text>
  <text class="f t-dsc" x="390" y="617">無 ECR、無 Logs 權限</text>
  <text class="f t-dsc" x="390" y="629">→ 應用程式不能拉映像</text>
  <text class="f t-dsc" x="390" y="641">也不能寫自己的 log group</text>
  <circle cx="358" cy="514" r="11" fill="#232F3E"/>
  <text class="f bdg" x="358" y="518">3</text>

  <path class="arrow" d="M418,548 H494"/>

  <!-- policy card 1 : bedrock -->
  <rect x="500" y="404" width="548" height="100" rx="6" fill="#FFFFFF" stroke="#C6CDD3" stroke-width="1"/>
  <text class="f t-pol" x="514" y="424">fleetmind-ecs-task-inline</text>
  <rect x="908" y="411" width="126" height="17" rx="8.5" fill="#FBE3E7" stroke="#DD344C" stroke-width="0.8"/>
  <text class="f" x="971" y="423" text-anchor="middle" font-size="9" font-weight="700" fill="#DD344C">Resource: * 萬用字元</text>
  <text class="f t-k" x="514" y="446">Effect</text>
  <text class="f m t-v" x="584" y="446">Allow</text>
  <text class="f t-k" x="514" y="464">Action</text>
  <text class="f m t-v" x="584" y="464">bedrock:InvokeModel</text>
  <text class="f m t-v" x="584" y="478">bedrock:InvokeModelWithResponseStream</text>
  <text class="f t-k" x="514" y="496">Resource</text>
  <text class="f m t-vred" x="584" y="496">*</text>
  <text class="f t-fine" x="600" y="496">未縮小到資源層級</text>

  <path class="arrow" d="M1048,436 H1128"/>
  <circle cx="1088" cy="418" r="11" fill="#232F3E"/>
  <text class="f bdg" x="1088" y="422">4</text>
  <rect x="1138" y="414" width="44" height="44" rx="8" fill="#01A88D"/>
  <use href="#g-bed" transform="translate(1146.4,422.4) scale(1.1367)"/>
  <text class="f t-svc" x="1160" y="472">Amazon Bedrock</text>
  <text class="f t-dsc" x="1160" y="484">us.anthropic.claude-haiku-4-5-20251001-v1:0</text>
  <text class="f t-dsc" x="1160" y="496">Converse API</text>

  <!-- policy card 2 : sns -->
  <rect x="500" y="516" width="548" height="100" rx="6" fill="#FFFFFF" stroke="#C6CDD3" stroke-width="1"/>
  <text class="f t-pol" x="514" y="536">fleetmind-ecs-task-sns</text>
  <rect x="898" y="523" width="136" height="17" rx="8.5" fill="#EFF5E4" stroke="#7AA116" stroke-width="0.8"/>
  <text class="f" x="966" y="535" text-anchor="middle" font-size="9" font-weight="700" fill="#5B7F16">資源已釘死到單一 ARN</text>
  <text class="f t-k" x="514" y="558">Effect</text>
  <text class="f m t-v" x="584" y="558">Allow</text>
  <text class="f t-k" x="514" y="576">Action</text>
  <text class="f m t-v" x="584" y="576">sns:Publish</text>
  <text class="f t-k" x="514" y="594">Resource</text>
  <text class="f m t-v" x="584" y="594">arn:aws:sns:us-east-1:516665228894:fleetmind-alerts</text>
  <text class="f t-fine" x="584" y="608">三條 inline 政策中，只有這一條把 Resource 收到單一資源。</text>

  <path class="arrow" d="M1048,548 H1128"/>
  <circle cx="1088" cy="530" r="11" fill="#232F3E"/>
  <text class="f bdg" x="1088" y="534">5</text>
  <rect x="1138" y="526" width="44" height="44" rx="8" fill="#E7157B"/>
  <use href="#g-sns" transform="translate(1146.4,534.4) scale(1.1367)"/>
  <text class="f t-svc" x="1160" y="584">Amazon SNS</text>
  <text class="f t-dsc" x="1160" y="596">topic fleetmind-alerts</text>
  <text class="f t-warn" x="1160" y="608">0 個訂閱者：publish 成功但無人接收</text>

  <!-- policy card 3 : ses -->
  <rect x="500" y="628" width="548" height="100" rx="6" fill="#FFFFFF" stroke="#C6CDD3" stroke-width="1"/>
  <text class="f t-pol" x="514" y="648">fleetmind-ses-send</text>
  <rect x="908" y="635" width="126" height="17" rx="8.5" fill="#FBE3E7" stroke="#DD344C" stroke-width="0.8"/>
  <text class="f" x="971" y="647" text-anchor="middle" font-size="9" font-weight="700" fill="#DD344C">Resource: * 萬用字元</text>
  <text class="f t-k" x="514" y="670">Effect</text>
  <text class="f m t-v" x="584" y="670">Allow</text>
  <text class="f t-k" x="514" y="688">Action</text>
  <text class="f m t-v" x="584" y="688">ses:SendEmail, ses:SendRawEmail</text>
  <text class="f t-k" x="514" y="706">Resource</text>
  <text class="f m t-vred" x="584" y="706">*</text>
  <text class="f t-fine" x="600" y="706">未縮小到寄件身分層級</text>

  <path class="arrow" d="M1048,660 H1128"/>
  <circle cx="1088" cy="642" r="11" fill="#232F3E"/>
  <text class="f bdg" x="1088" y="646">6</text>
  <rect x="1138" y="638" width="44" height="44" rx="8" fill="#E7157B"/>
  <use href="#g-ses" transform="translate(1146.4,646.4) scale(1.1367)"/>
  <text class="f t-svc" x="1160" y="696">Amazon SES v2</text>
  <text class="f t-dsc" x="1160" y="708">sender / recipients</text>
  <text class="f t-dsc" x="1160" y="720">wsx5031060310guy@gmail.com</text>

  <!-- honesty callout -->
  <rect x="1288" y="404" width="240" height="324" rx="6" fill="#F4F6F8" stroke="#D5DBE1" stroke-width="1"/>
  <text class="f t-bulh" x="1302" y="425">範圍誠實標註（任務角色）</text>
  <text class="f t-bul" x="1302" y="448">· 動作已收斂：只有 InvokeModel，</text>
  <text class="f t-bul" x="1310" y="462">不是 bedrock:*</text>
  <text class="f t-bul" x="1302" y="482">· 只有 SNS 釘死到單一 topic ARN</text>
  <text class="f t-bul" x="1302" y="502">· Bedrock 與 SES 仍是 Resource: *，</text>
  <text class="f t-bul" x="1310" y="516">尚未縮小到資源層級</text>
  <text class="f t-bul" x="1302" y="536">· 兩角色分離是真的最小權限收穫：</text>
  <text class="f t-bul" x="1310" y="550">應用程式永遠不能拉映像，</text>
  <text class="f t-bul" x="1310" y="564">也不能寫自己的 log group</text>
  <text class="f t-bul" x="1302" y="584">· 因此本圖不宣稱整體「最小權限」；</text>
  <text class="f t-bul" x="1310" y="598">正確說法是：動作收斂、</text>
  <text class="f t-bul" x="1310" y="612">一個資源釘死、兩個仍是萬用字元</text>
  <line x1="1302" y1="628" x2="1514" y2="628" stroke="#D5DBE1" stroke-width="1"/>
  <text class="f t-bul" x="1302" y="648">· 兩角色的 trust policy 皆為</text>
  <text class="f m t-bul" x="1310" y="662">ecs-tasks.amazonaws.com</text>
  <text class="f t-bul" x="1302" y="682">· 事實表明列未使用、故本圖不畫：</text>
  <text class="f t-bul" x="1310" y="696">S3 / DynamoDB（Java 零引用、</text>
  <text class="f t-bul" x="1310" y="710">pom 只有 bedrockruntime / sns / sesv2）</text>

  <!-- ===================== LANE C : network permission boundary ===================== -->
  <rect x="92" y="744" width="1448" height="124" rx="6" class="grpbox netbox"/>
  <circle cx="108" cy="757" r="11" fill="#232F3E"/>
  <text class="f bdg" x="108" y="761">7</text>
  <text class="f t-grp" x="126" y="762">網路權限邊界（今日收緊）· VPC vpc-0415efac81151722c · 兩個子網皆為 public（mapPublicIpOnLaunch=true）</text>

  <!-- 0.0.0.0/0 lives OUTSIDE the AWS Cloud boundary; the arrow crosses it into the VPC -->
  <rect x="18" y="782" width="40" height="40" rx="8" fill="#7D8998"/>
  <use href="#g-net" transform="translate(25.6,789.6) scale(1.0333)"/>
  <text class="f t-svc" x="38" y="836">網際網路</text>
  <text class="f t-dsc" x="38" y="848">0.0.0.0/0</text>

  <path class="arrow" d="M66,802 H272"/>
  <text class="f t-arw" x="169" y="796" text-anchor="middle">tcp/80</text>

  <rect x="280" y="782" width="40" height="40" rx="8" fill="#8C4FFF"/>
  <use href="#g-alb" transform="translate(287.6,789.6) scale(1.0333)"/>
  <text class="f t-svc" x="300" y="836">fleetmind-alb（ALB）</text>
  <text class="f t-dsc" x="300" y="848">SG sg-03bc43a8da199af1a</text>

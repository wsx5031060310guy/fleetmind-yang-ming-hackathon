  <text x="811" y="517" text-anchor="middle" font-size="11.5" font-weight="600" fill="#232F3E">ECS Fargate task</text>
  <text x="811" y="531" text-anchor="middle" font-size="9" font-style="italic" fill="#6B7885">叢集 fleetmind · 服務 fleetmind-svc · 任務定義 fleetmind-api:5</text>
  <text x="811" y="543" text-anchor="middle" font-size="9" font-style="italic" fill="#6B7885">FARGATE · ARM64 / Linux · 512 CPU · 1024 MiB · awsvpc</text>
  <text x="811" y="555" text-anchor="middle" font-size="9" font-style="italic" fill="#6B7885">容器埠 8080/tcp · 172.31.65.255:8080 · desiredCount 1</text>
  <text x="811" y="567" text-anchor="middle" font-size="9" font-style="italic" fill="#6B7885">Spring Boot 單一容器：靜態頁面 + REST API</text>
  <text x="811" y="579" text-anchor="middle" font-size="9" font-style="italic" fill="#879196">assignPublicIp=ENABLED（有公開 IP，用於免 NAT 拉 ECR）</text>
  <text x="811" y="595" text-anchor="middle" font-size="8" font-style="italic" fill="#5A6470">今日收緊：原本入站為 0.0.0.0/0，</text>
  <text x="811" y="606" text-anchor="middle" font-size="8" font-style="italic" fill="#5A6470">curl 公開 IP 98.92.30.118:8080 曾回 200；改後逾時，ALB 仍 200</text>

  <circle cx="958" cy="443" r="11" fill="#232F3E"/>
  <text x="958" y="447" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">2</text>


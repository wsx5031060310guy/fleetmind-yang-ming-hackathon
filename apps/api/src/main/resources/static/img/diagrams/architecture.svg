    <circle cx="30.5" cy="27.2" r="2" fill="#FFFFFF"/>
    <circle cx="13.5" cy="27.2" r="2" fill="#FFFFFF"/>
  </g>
  <text x="1170" y="240" font-size="11.5" font-weight="600" fill="#232F3E">Amazon Bedrock</text>
  <text x="1170" y="254" font-size="9" font-style="italic" fill="#6B7885">us.anthropic.claude-haiku-4-5-20251001-v1:0 · Converse API</text>
  <text x="1170" y="266" font-size="9" font-style="italic" fill="#6B7885">/api/vessels/{id}/ai-brief → AiBriefGuardrail.validate()</text>
  <text x="1170" y="278" font-size="9" font-style="italic" fill="#6B7885">通過 → 回傳並快取為 last-good；不通過 → 用 last-good → 決定性 fallback</text>


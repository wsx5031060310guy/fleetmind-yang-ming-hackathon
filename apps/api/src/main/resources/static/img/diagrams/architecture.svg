  <text x="1170" y="416" font-size="9" font-style="italic" fill="#6B7885">arn:aws:sns:us-east-1:516665228894:fleetmind-alerts</text>
  <path d="M1173 424 L1180.5 437 H1165.5 Z" fill="none" stroke="#D13212" stroke-width="1.1" stroke-linejoin="round"/>
  <text x="1173" y="435.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#D13212">!</text>
  <text x="1187" y="435" font-size="9" font-style="italic" fill="#D13212">0 個訂閱 —— Publish 會成功，但目前扇出到沒有任何人</text>


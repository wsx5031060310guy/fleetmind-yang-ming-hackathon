  <text x="40" y="64" font-size="11.5" fill="#5A6470">帳號 516665228894 · 區域 us-east-1 · 圖中 AWS 資源組態與端點狀態於 2026-07-15 以 boto3 / curl 自實際帳號讀回；標〔推導〕〔非讀回〕者除外，依據見該處註記</text>


  <path d="M1113 685 H1078 V640 H960 V493 H835" stroke="#7D8998" stroke-width="1" fill="none" stroke-dasharray="5 4" marker-end="url(#ah-arch)"/>

  <circle cx="1022" cy="300" r="11" fill="#232F3E"/>
  <text x="1022" y="304" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">4</text>
  <circle cx="1108" cy="366" r="11" fill="#232F3E"/>
  <text x="1108" y="370" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">5</text>
  <circle cx="1064" cy="585" r="11" fill="#232F3E"/>
  <text x="1064" y="589" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">6</text>

  <!-- ===== Panel A — the absent data layer ===== -->
  <rect x="315" y="742" width="695" height="116" rx="5" fill="none" stroke="#879196" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="333" cy="760" r="10" fill="#232F3E"/>
  <text x="333" y="764" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">3</text>
  <text x="352" y="764" font-size="10.5" font-weight="600" fill="#232F3E">請求路徑中沒有任何資料存放<tspan dx="8" font-size="8.5" font-weight="400" fill="#6B7885">〔非讀回 · 依原始碼與部署紀錄〕</tspan></text>

  <g transform="translate(330,782)">
    <rect width="38" height="38" rx="7" fill="#FFFFFF" stroke="#B9BEC5" stroke-width="1.3" stroke-dasharray="3 2.5"/>
    <path d="M11 12 H27 L25 27 H13 Z" fill="none" stroke="#B9BEC5" stroke-width="1.4"/>
    <path d="M6 32 L32 6" stroke="#B9BEC5" stroke-width="1.5"/>
  </g>
  <text x="349" y="833" text-anchor="middle" font-size="7.5" fill="#879196">Amazon S3</text>
  <g transform="translate(411,782)">
    <rect width="38" height="38" rx="7" fill="#FFFFFF" stroke="#B9BEC5" stroke-width="1.3" stroke-dasharray="3 2.5"/>
    <ellipse cx="19" cy="12" rx="8" ry="3.2" fill="none" stroke="#B9BEC5" stroke-width="1.3"/>
    <path d="M11 12 V26 A 8 3.2 0 0 0 27 26 V12" fill="none" stroke="#B9BEC5" stroke-width="1.3"/>
    <path d="M6 32 L32 6" stroke="#B9BEC5" stroke-width="1.5"/>
  </g>
  <text x="430" y="833" text-anchor="middle" font-size="7.5" fill="#879196">Amazon DynamoDB</text>

  <text x="490" y="776" font-size="9" fill="#232F3E">RealDataService 直接從映像內讀取 real-metrics.json —— 無網路呼叫、無資料庫、無快取層。</text>
  <text x="490" y="790" font-size="9" fill="#232F3E">映像由 ECR 拉取，real-metrics.json 在 build time 就已烘入；冷啟動當下即有真實資料。</text>
  <text x="490" y="804" font-size="8.5" fill="#5A6470">Java 程式碼對 S3 / DynamoDB 零參照；pom 內唯一的 AWS SDK 依賴為 bedrockruntime、sns、sesv2。</text>
  <text x="490" y="818" font-size="8.5" fill="#5A6470">App Runner 因帳號權限被擋（AccessDenied）；EC2 + Docker 為未使用的備援方案。</text>

  <!-- ===== Panel B — IAM ===== -->
  <rect x="1085" y="742" width="470" height="116" rx="5" fill="none" stroke="#879196" stroke-width="1" stroke-dasharray="4 3"/>
  <g transform="translate(1097,752)">
    <rect width="32" height="32" rx="6" fill="#DD344C"/>
    <path d="M11 15.5 V11.5 A5 5 0 0 1 21 11.5 V15.5" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <rect x="8.5" y="15" width="15" height="10" rx="2" fill="#FFFFFF"/>
  </g>
  <text x="1137" y="768" font-size="10.5" font-weight="600" fill="#232F3E">IAM — 兩個分離的角色（皆信任 ecs-tasks.amazonaws.com）</text>
  <text x="1097" y="796" font-size="8.5" fill="#232F3E">任務角色 fleetmind-ecs-task</text>
  <text x="1097" y="808" font-size="8.5" fill="#5A6470">· sns:Publish → 僅限 arn:aws:sns:us-east-1:516665228894:fleetmind-alerts</text>
  <text x="1097" y="820" font-size="8.5" fill="#D13212">· bedrock:InvokeModel(+WithResponseStream)、ses:SendEmail/SendRawEmail → Resource: *</text>
  <text x="1097" y="834" font-size="8.5" fill="#232F3E">執行角色 fleetmind-ecs-exec<tspan fill="#5A6470"> · AmazonECSTaskExecutionRolePolicy（拉 ECR、寫 Logs）</tspan></text>
  <text x="1097" y="848" font-size="8.5" fill="#5A6470">角色分離＝應用程式本身永遠拉不了映像、也碰不到日誌群組；但動作雖窄，Resource 仍有萬用字元。</text>
</svg>

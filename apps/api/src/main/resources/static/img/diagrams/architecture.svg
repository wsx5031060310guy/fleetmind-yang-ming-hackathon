  <text x="1170" y="493" font-size="9" font-style="italic" fill="#6B7885">SendEmail · 寄件者／收件者 wsx5031060310guy@gmail.com</text>
  <text x="1170" y="505" font-size="9" font-style="italic" fill="#6B7885">今天真正會送達的告警路徑</text>

  <!-- CloudWatch Logs -->
  <g transform="translate(1115,588)">
    <rect width="44" height="44" rx="8" fill="#E7157B"/>
    <path d="M13 9 H26 L32 15 V35 H13 Z" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M26 9 V15 H32" fill="none" stroke="#FFFFFF" stroke-width="1.3"/>
    <path d="M17 21 H28 M17 25.5 H28 M17 30 H24" stroke="#FFFFFF" stroke-width="1.3" fill="none"/>
  </g>
  <text x="1170" y="604" font-size="11.5" font-weight="600" fill="#232F3E">Amazon CloudWatch Logs</text>
  <text x="1170" y="618" font-size="9" font-style="italic" fill="#6B7885">日誌群組 /fleetmind/api · 串流前綴 ecs</text>
  <text x="1170" y="630" font-size="9" font-style="italic" fill="#6B7885">由執行角色 fleetmind-ecs-exec 寫入</text>

  <!-- ECR -->
  <g transform="translate(1115,663)">
    <rect width="44" height="44" rx="8" fill="#ED7100"/>
    <rect x="10" y="10" width="24" height="7" rx="1.5" fill="#FFFFFF"/>
    <rect x="10" y="19.5" width="24" height="7" rx="1.5" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <rect x="10" y="29" width="24" height="7" rx="1.5" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>
  <text x="1170" y="679" font-size="11.5" font-weight="600" fill="#232F3E">Amazon ECR · fleetmind-api</text>
  <text x="1170" y="693" font-size="9" font-style="italic" fill="#6B7885">516665228894.dkr.ecr.us-east-1.amazonaws.com/fleetmind-api</text>
  <text x="1170" y="705" font-size="9" font-style="italic" fill="#6B7885">ARM64 多階段建置 · real-metrics.json 於 build 時烘入映像（虛線＝部署路徑）</text>

  <!-- Flows 4 / 5 / 6 and the ECR image pull -->
  <path d="M835 477 H1064" stroke="#7D8998" stroke-width="1" fill="none"/>
  <path d="M1022 477 V245 H1110" stroke="#7D8998" stroke-width="1" fill="none" marker-end="url(#ah-arch)"/>
  <path d="M1036 477 V408 H1110" stroke="#7D8998" stroke-width="1" fill="none" marker-end="url(#ah-arch)"/>

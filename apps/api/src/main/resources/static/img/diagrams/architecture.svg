    <rect x="13" y="13" width="8" height="8" rx="1.5" fill="#FFFFFF"/>
    <rect x="23" y="13" width="8" height="8" rx="1.5" fill="#FFFFFF"/>
    <rect x="13" y="23" width="8" height="8" rx="1.5" fill="#FFFFFF"/>
    <rect x="23" y="23" width="8" height="8" rx="1.5" fill="#FFFFFF"/>

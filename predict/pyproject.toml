[project]
name = "fleetpredict"
version = "0.1.0"
description = "Yang Ming fuel-consumption prediction pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetpredict"]

[tool.pytest.ini_options]
testpaths = ["tests"]

